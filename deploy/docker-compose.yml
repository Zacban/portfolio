# Runs on the VPS (in ~/portfolio). The deploy workflow copies this file and the
# Caddyfile there, then runs `docker compose pull && docker compose up -d`.
#
# Values like SITE_DOMAIN come from the .env file next to this one, which the
# workflow also writes.

services:
  # Caddy is the front door: it listens on ports 80/443, gets and renews HTTPS
  # certificates automatically, and forwards requests to the right container.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates live here — keep this volume!
      - caddy_config:/config
    depends_on:
      - web

  # The portfolio site itself (nginx + index.html). Not exposed directly —
  # only Caddy can reach it, over Docker's internal network.
  web:
    image: ghcr.io/zacban/portfolio:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # Later: the .NET 10 backend goes here, e.g.
  # api:
  #   image: ghcr.io/zacban/portfolio-api:${IMAGE_TAG:-latest}
  #   restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
