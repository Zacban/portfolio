<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zac — Coming Soon</title>
  <meta name="description" content="Portfolio of Zac, software developer. Coming soon." />

  <!-- Open Graph (how the link looks when shared) -->
  <meta property="og:title" content="Zac — Coming Soon" />
  <meta property="og:description" content="Software developer portfolio. Under construction." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />

  <style>
    :root {
      --bg: #0b0f1a;
      --bg-glow: #131a2e;
      --fg: #e6edf6;
      --muted: #8b98b0;
      --accent: #5b8cff;
      --accent-2: #7df3d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), var(--bg) 60%);
      color: var(--fg);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    .card {
      position: relative;
      text-align: center;
      max-width: 640px;
      z-index: 1;
    }

    .eyebrow {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--fg), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    p.tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 0.6rem 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 0 var(--accent-2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(125, 243, 208, 0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(125, 243, 208, 0); }
      100% { box-shadow: 0 0 0 0 rgba(125, 243, 208, 0); }
    }

    .links {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    .links a:hover { color: var(--accent); }

    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(139, 152, 176, 0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Software Developer</div>
    <h1>Something is being built here.</h1>
    <p class="tagline">
      My portfolio is under construction. Check back soon —
      or find me in the meantime below.
    </p>

    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      Coming soon
    </div>

    <nav class="links">
      <a href="https://github.com/zacban" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:zacban@gmail.com">Email</a>
    </nav>
  </main>

  <footer>© 2026 Zac · Built in the open</footer>
</body>
</html>
