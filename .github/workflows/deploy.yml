name: Deploy to VPS

# Run this pipeline every time we push to the main branch.
on:
  push:
    branches: [main]
  # Also allow running it manually from the GitHub "Actions" tab.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zacban/portfolio

jobs:
  # 1. Build the site into a Docker image and publish it to GitHub's
  #    container registry (ghcr.io). Each image is tagged with the commit SHA
  #    (so any version can be rolled back to) and with "latest".
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 2. SSH into the VPS, copy the compose setup over, and pull + restart the
  #    containers with the new image.
  #    Credentials come from encrypted GitHub "secrets" (never in the code).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "portfolio"
          strip_components: 1

      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,SITE_DOMAIN,IMAGE_TAG
          script_stop: true
          script: |
            cd ~/portfolio
            printf 'SITE_DOMAIN=%s\nIMAGE_TAG=%s\n' "$SITE_DOMAIN" "$IMAGE_TAG" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
